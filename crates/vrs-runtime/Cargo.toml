[package]
name = "vrs-runtime"
description = "Visual Rust Studio — runtime copié dans les applications générées (src/vrs/)"
version.workspace = true
edition.workspace = true
license = "MIT-0"
authors.workspace = true
rust-version.workspace = true

# IMPORTANT : src/lib.rs est copié tel quel dans chaque projet graphique sous
# `src/vrs/mod.rs`. Il doit donc rester un fichier unique, valide à la fois comme
# racine de crate et comme module, sans `crate::` ni dépendance autre qu'eframe.

[dependencies]
eframe.workspace = true

[dev-dependencies]
egui_kittest.workspace = true

[lints]
workspace = true
