files = [".gitignore", "Cargo.toml", "ClickCounter.vrsproj", "README.md", "forms/Form1.vrsform", "src/forms/form1.rs", "src/forms/form1_designer.rs", "src/forms/mod.rs", "src/main.rs", "src/vrs/mod.rs"]

