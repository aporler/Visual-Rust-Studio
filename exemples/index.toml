# Catalogue of the Visual Rust Studio examples / Catalogue des exemples de Visual Rust Studio.
#
# Read by the IDE (File → Examples). To add an example: add its folder in each
# language directory and an [[example]] entry below; no recompilation needed.
# Lu par l'IDE (Fichier → Exemples). Pour ajouter un exemple : ajoutez son
# dossier dans chaque dossier de langue et une entrée [[example]] ci-dessous ;
# aucune recompilation n'est nécessaire.

version = 1
languages = ["en-US", "fr-CA"]

[[example]]
id = "hello-terminal"
level = "beginner"
folder = "HelloWorldTerminal"
title = { en-US = "Hello World (terminal)", fr-CA = "Hello World (terminal)" }
description = { en-US = "Your first Rust program: it writes a line in the console.", fr-CA = "Votre premier programme Rust : il écrit une ligne dans la console." }
files = [".gitignore", "Cargo.toml", "HelloWorldTerminal.vrsproj", "README.md", "src/main.rs"]

[[example]]
id = "hello-window"
level = "beginner"
folder = "HelloWorldWindow"
title = { en-US = "Hello World (window)", fr-CA = "Hello World (fenêtre)" }
description = { en-US = "A window with a text and a button that closes the application.", fr-CA = "Une fenêtre avec un texte et un bouton qui ferme l'application." }
files = [".gitignore", "Cargo.toml", "HelloWorldWindow.vrsproj", "README.md", "forms/Form1.vrsform", "src/forms/form1.rs", "src/forms/form1_designer.rs", "src/forms/mod.rs", "src/main.rs", "src/vrs/mod.rs"]

